[defaults]
inventory = inventory.yml
roles_path = roles
stdout_callback = yaml
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
# The stick is slow; give facts and package work room to breathe.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
