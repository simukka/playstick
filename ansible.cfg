[defaults]
inventory = inventory.yml
roles_path = roles
# NOT stdout_callback = yaml: that callback lives in community.general, and
# this repo is deliberately collection-free. result_format is the ansible-core
# built-in that gives the same readable YAML output.
callback_result_format = yaml
callback_format_pretty = true
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
# The stick is slow; give facts and package work room to breathe.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
