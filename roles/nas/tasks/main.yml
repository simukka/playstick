---
- name: NAS library is enabled
  when:
    - nas_enabled | bool
    - nas_server | length > 0
    - nas_share | length > 0
  block:

    # A share name and a server-side path are not the same thing, and on a
    # Synology they look alike enough to swap by accident: the movie folder is
    # /volume1/video on the NAS's own disks and //backup/video on the wire.
    # Both wrong forms fail below the play, in the kernel, naming neither the
    # variable nor the role -- "Malformed UNC in devname" in dmesg for the
    # absolute path, mount error(2) for the volume prefix. Catch it here, where
    # there is room to say which variable and what to put in it.
    - name: Refuse a server-side path where a share name belongs
      ansible.builtin.assert:
        that:
          - nas_share_unc | length > 0
          - nas_share_unc is not match('volume\d+/')
        fail_msg: >-
          nas_share is "{{ nas_share }}", which is where the folder lives on
          the NAS, not what the NAS exports. Use the share name alone -- for a
          Synology serving /volume1/video that is "video", giving
          //{{ nas_server }}/video. Check the exported names under DSM ->
          Control Panel -> Shared Folder, or with
          `smbclient -L {{ nas_server }} -U <user>`.
        success_msg: "Library share is //{{ nas_server }}/{{ nas_share_unc }}."

    - name: Install the CIFS mount helper
      ansible.builtin.apt:
        name: cifs-utils
        state: present

    - name: Create the configuration directory
      ansible.builtin.file:
        path: "{{ nas_credentials_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # Kept out of the unit file, which is world-readable in /etc/systemd/system.
    # no_log because the whole point of the task is the password.
    - name: Install the share credentials
      ansible.builtin.template:
        src: nas.cred.j2
        dest: "{{ nas_credentials_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: nas_username | length > 0
      notify: Reload systemd

    # Only on the first run, when the directory is a directory. Once the
    # automount is installed the path is an autofs trigger, and touching its
    # attributes is a lookup -- which mounts the share, read-only, and then
    # applies owner and mode to the CIFS root instead of to the mountpoint
    # underneath it. That fails with EROFS, on a re-run, after the share
    # started working: "[Errno 30] Read-only file system: b'/srv/movies'".
    #
    # findmnt reads /proc/self/mountinfo rather than walking the path, so
    # asking the question does not itself trigger the automount. rc is 1 when
    # nothing is mounted there, including when the directory does not exist.
    - name: Look for anything already mounted on the mount point
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output=FSTYPE
          - --mountpoint
          - "{{ nas_mount_point }}"
      register: nas_existing_mount
      changed_when: false
      failed_when: false

    - name: Create the mount point
      ansible.builtin.file:
        path: "{{ nas_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: nas_existing_mount.rc != 0

    - name: Note that the mount point is in use
      ansible.builtin.debug:
        msg: >-
          {{ nas_mount_point }} already carries a
          {{ nas_existing_mount.stdout_lines | last | trim }} mount, so its
          ownership is left alone -- what is visible there belongs to the
          share, not to this directory. (Two mounts stack here once this is
          working: the autofs trigger, and the CIFS mount on top of it. The
          last line is the one you can see.)
      when: nas_existing_mount.rc == 0

    # systemd derives unit names from the path by its own escaping rules, and
    # getting them wrong by hand produces a unit that installs cleanly and
    # never triggers. Ask systemd rather than guess.
    - name: Work out the systemd unit names for the mount point
      ansible.builtin.command: >-
        systemd-escape --path --suffix=mount {{ nas_mount_point | quote }}
      register: nas_escaped
      changed_when: false

    - name: Remember the derived unit names
      ansible.builtin.set_fact:
        nas_mount_unit: "{{ nas_escaped.stdout | trim }}"
        nas_automount_unit: "{{ nas_escaped.stdout | trim | regex_replace('\\.mount$', '.automount') }}"

    - name: Install the mount unit
      ansible.builtin.template:
        src: nas.mount.j2
        dest: "/etc/systemd/system/{{ nas_mount_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install the automount unit
      ansible.builtin.template:
        src: nas.automount.j2
        dest: "/etc/systemd/system/{{ nas_automount_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Flush handlers so systemd knows the units before they are enabled
      ansible.builtin.meta: flush_handlers

    # Only the automount is enabled. The .mount is pulled in by the kernel
    # walking into the directory, which is the whole point of the arrangement.
    - name: Enable the automount
      ansible.builtin.systemd:
        name: "{{ nas_automount_unit }}"
        enabled: true
        state: started

    # Non-fatal on purpose: a NAS that happens to be off must not fail the
    # play. The player role reports an unreachable library at runtime.
    - name: Check that the share is reachable
      ansible.builtin.command: "ls -1 {{ nas_mount_point | quote }}"
      register: nas_listing
      changed_when: false
      failed_when: false

    - name: Report what the library looks like
      ansible.builtin.debug:
        msg: >-
          {{ ('%d entries under %s' | format(nas_listing.stdout_lines | length, nas_mount_point))
             if nas_listing.rc == 0
             else ('Share not reachable right now (rc=%d) -- the automount will retry on next access.'
                   | format(nas_listing.rc)) }}

- name: NAS library is not configured
  when: not (nas_enabled | bool) or nas_server | length == 0 or nas_share | length == 0
  ansible.builtin.debug:
    msg: >-
      Skipping the NAS mount: set nas_server and nas_share (and vault
      nas_username / nas_password) to enable the movie library.
