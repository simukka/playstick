---
- name: Movie player is enabled
  when: player_enabled | bool
  block:

    # The daemon stops this unit to take DRM master and starts it again
    # afterwards. If it does not exist, the arbitration has nothing to arbitrate
    # and the failure would show up as a film that plays over a black screen.
    - name: Require the AirPlay unit the player arbitrates against
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ player_airplay_unit }}"
      register: player_airplay_stat

    - name: Refuse to install an arbiter with nothing to arbitrate
      ansible.builtin.assert:
        that: player_airplay_stat.stat.exists
        fail_msg: >-
          {{ player_airplay_unit }} is not installed. The player has to stop it
          to take DRM master -- uxplay-kms holds the card from service start,
          not from the first client. Set player_airplay_unit to the unit you
          actually run, or run the uxplay role first.
        success_msg: "Arbitrating the display against {{ player_airplay_unit }}."

    - name: Install the player
      ansible.builtin.apt:
        name:
          - mpv          # decoder, container support, DRM output and the IPC channel
          - iproute2     # ss, for the AirPlay gate
        state: present

    - name: Record the installed mpv version
      ansible.builtin.command: mpv --version
      register: player_mpv_version
      changed_when: false
      failed_when: false

    - name: Show the installed mpv version
      ansible.builtin.debug:
        msg: "{{ player_mpv_version.stdout_lines | default(['unknown']) | first }}"

    # Not fatal: which video output works here is a probe result, and asserting
    # on it would block the install that ships the probe.
    - name: Check that mpv has the configured video output
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          mpv --vo=help 2>/dev/null | grep -qE '^\s+{{ player_vo }}\b'
      register: player_vo_check
      changed_when: false
      failed_when: false

    - name: Warn if the configured video output is missing
      ansible.builtin.debug:
        msg: >-
          mpv does not list a "{{ player_vo }}" video output. Playback will
          fail -- run the player probe and set player_vo from the result.
      when: player_vo_check.rc != 0

    # The serial cable to the projector. The whole block is skipped when no
    # model is configured, which is the shipped state: with none set the daemon
    # builds a NullProjector and behaves exactly as it did before this feature
    # existed.
    - name: Locate the projector
      when: player_projector_model | length > 0
      block:

        # The same shape as drm_card_path discovery in the graphics role, and
        # for the same reason: the path should not have to be written down for
        # the usual case, and must be overridable when the usual case is wrong.
        - name: Find the USB serial adapter
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              ls -1 /dev/serial/by-id/*FTDI* 2>/dev/null | head -1 && exit 0
              ls -1 /dev/serial/by-id/* 2>/dev/null | head -1
          register: player_projector_found
          changed_when: false
          failed_when: false
          when: player_projector_device | length == 0

        - name: Use the adapter that was found
          ansible.builtin.set_fact:
            player_projector_device: "{{ player_projector_found.stdout | trim }}"
          when: player_projector_device | length == 0
                and player_projector_found.stdout | default('') | trim | length > 0

        - name: Refuse to configure a projector with no cable to it
          ansible.builtin.assert:
            that: player_projector_device | length > 0
            fail_msg: >-
              player_projector_model is "{{ player_projector_model }}" but
              nothing was found under /dev/serial/by-id and
              player_projector_device is not set. Plug the adapter in, or set
              the path explicitly. `lsusb | grep 0403` says whether the kernel
              sees the adapter at all; `dmesg | tail` says what it made of it.
            success_msg: >-
              Projector {{ player_projector_model }} on
              {{ player_projector_device }}.

        # Not fatal, and not the same question as "is a device present": this
        # catches a kernel whose serial drivers were trimmed away, which
        # presents as a projector that never answers -- indistinguishable from
        # the wrong cable, and worth one line here rather than an evening with
        # a multimeter.
        - name: Check that the FTDI serial driver is available
          ansible.builtin.command: modinfo ftdi_sio
          register: player_ftdi
          changed_when: false
          failed_when: false

        - name: Warn if the FTDI serial driver is missing
          ansible.builtin.debug:
            msg: >-
              modinfo cannot find ftdi_sio. If the projector never answers,
              this is why -- the adapter needs it to appear as a tty at all.
              Install linux-modules-extra for this kernel.
          when: player_ftdi.rc != 0

    - name: Create the poster cache
      ansible.builtin.file:
        path: "{{ player_thumb_dir }}"
        state: directory
        owner: "{{ player_user }}"
        group: "{{ player_user }}"
        mode: "0755"

    - name: Create the UI directory
      ansible.builtin.file:
        path: /usr/local/share/playstick
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The package first, then the entry point that imports it: a half-installed
    # daemon that restarts between the two would exec a script whose modules
    # are the previous version.
    #
    # Not synchronize/rsync -- the device has no rsync and this is eight small
    # files. The stale-module problem rsync's --delete would solve is handled
    # below instead, because a module that was removed upstream but left behind
    # here is dead weight that still shadows nothing and imports cleanly.
    - name: Install the player package
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/src/server/playstick/"
        dest: /usr/local/lib/playstick/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      register: player_package

    # Compared by path RELATIVE to the package root rather than by basename.
    # The package grew a subdirectory when the projector drivers arrived, and
    # basenames stopped being unique the moment it did -- projector/base.py and
    # a future base.py at the top level would each keep the other alive.
    # ONE LINE PER SUBPACKAGE, and it has to be written out: fileglob returns
    # files only and does not cross a directory boundary, so '*/*.py' matches
    # nothing at all rather than matching everything. Forgetting to add a line
    # here fails in the harmless direction -- stale modules in that
    # subdirectory stop being pruned, which is dead weight that still shadows
    # nothing and imports cleanly.
    - name: List the modules this release ships
      vars:
        player_pkg_src: "{{ playbook_dir }}/src/server/playstick"
      ansible.builtin.set_fact:
        player_shipped: >-
          {{ (lookup('ansible.builtin.fileglob',
                     player_pkg_src ~ '/*.py', wantlist=True)
              + lookup('ansible.builtin.fileglob',
                       player_pkg_src ~ '/projector/*.py', wantlist=True))
             | map('relpath', player_pkg_src) | list }}

    - name: Find stale modules left by an older release
      ansible.builtin.find:
        paths: /usr/local/lib/playstick
        patterns: "*.py"
        recurse: true
      register: player_installed

    - name: Remove stale modules
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ player_installed.files }}"
      loop_control:
        label: "{{ item.path | relpath('/usr/local/lib/playstick') }}"
      when: item.path | relpath('/usr/local/lib/playstick') not in player_shipped
      register: player_pruned

    # Under the unit's ProtectSystem=full the daemon cannot write here, so in
    # normal service these directories never appear. They show up after
    # somebody runs the script by hand as root to debug something, and then
    # survive the next deploy -- which is the only way stale bytecode ever gets
    # a chance. Recursive since the package has subpackages: a __pycache__
    # missed inside one is exactly as stale as one missed at the top.
    - name: Find bytecode caches
      ansible.builtin.find:
        paths: /usr/local/lib/playstick
        patterns: "__pycache__"
        file_type: directory
        recurse: true
      register: player_pycache
      when: player_package is changed or player_pruned is changed

    - name: Drop the package bytecode cache
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ player_pycache.files | default([]) }}"
      loop_control:
        label: "{{ item.path | relpath('/usr/local/lib/playstick') }}"

    - name: Install the player daemon
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/src/server/playstick-web.py"
        dest: /usr/local/bin/playstick-web.py
        owner: root
        group: root
        mode: "0755"
      register: player_script

    - name: Install the web UI
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/src/player/dist/playstick-ui.html"
        dest: /usr/local/share/playstick/ui.html
        owner: root
        group: root
        mode: "0644"
      register: player_ui

    - name: Install the player unit
      ansible.builtin.template:
        src: playstick-web.service.j2
        dest: /etc/systemd/system/playstick-web.service
        owner: root
        group: root
        mode: "0644"
      register: player_unit
      notify: Reload systemd

    # avahi-daemon is already installed and required for AirPlay discovery, so
    # advertising the web UI on it costs a file. The point is that nobody has
    # to know the stick's IP address: http://{{ ansible_hostname }}.local:{{ player_port }}/
    # resolves from any iOS or macOS device on the LAN.
    - name: Advertise the web UI over mDNS
      ansible.builtin.template:
        src: playstick-web.avahi.j2
        dest: /etc/avahi/services/playstick-web.service
        owner: root
        group: root
        mode: "0644"
      when: player_advertise_mdns | bool
      notify: Reload avahi

    - name: Flush handlers so the unit is known before it is started
      ansible.builtin.meta: flush_handlers

    - name: Enable the player
      ansible.builtin.systemd:
        name: playstick-web.service
        enabled: true
        state: started
        daemon_reload: true

    # Not a handler, for the same reason the idle role does this: a handler
    # runs at the end of the play, and a re-provision should leave the new
    # daemon running, not the old one.
    #
    # Worth knowing rather than discovering: this stops a film that happens to
    # be playing. That is the right behaviour for a re-provision.
    - name: Restart the player after a change  # noqa: no-handler
      ansible.builtin.systemd:
        name: playstick-web.service
        state: restarted
      when: player_script is changed or player_ui is changed or player_unit is changed
            or player_package is changed or player_pruned is changed

    # The port is omitted at 80 rather than printed as ":80" -- this line is
    # what somebody types into a phone, and it should be the shortest thing
    # that works.
    - name: Report where the UI is
      vars:
        player_url_port: "{{ '' if player_port | int == 80 else ':' ~ player_port }}"
      ansible.builtin.debug:
        msg:
          - "Movie player: http://{{ ansible_host | default(ansible_hostname) }}{{ player_url_port }}/"
          - "        also: http://{{ ansible_hostname }}.local{{ player_url_port }}/"
          - >-
            Projector audio is
            {{ 'on, via ' ~ (player_audio_device | default('mpv default', true))
               if player_audio | bool
               else 'OFF -- the screen is silent. See player_audio.' }}
          - >-
            Headphone audio is
            {{ 'ON -- open the page on a phone, tap the speaker, pick a language.
                Films need playstick-prep.py run over them first.'
               if player_phone_audio | bool
               else 'off. See player_phone_audio.' }}
          - >-
            Projector control is
            {{ player_projector_model ~ ' on ' ~ player_projector_device
               ~ (', input ' ~ player_projector_input
                  if player_projector_input else ', input left alone')
               ~ ', off after ' ~ player_projector_idle_minutes ~ ' idle minutes.'
               if player_projector_model
               else 'off -- somebody has to switch the screen on by hand.
                     Run scripts/projector-probe.py, then set
                     player_projector_model.' }}

- name: Movie player is disabled
  when: not (player_enabled | bool)
  ansible.builtin.systemd:
    name: playstick-web.service
    enabled: false
    state: stopped
  failed_when: false
