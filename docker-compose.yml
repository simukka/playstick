services:
  # Main control node. `docker compose run --rm ansible '<command>'`
  ansible:
    build:
      context: .
      args:
        # HOST_UID rather than UID: bash treats UID as readonly, so a wrapper
        # cannot export it. Set by ./actl.
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: uxplay-atom-ansible
    volumes:
      - .:/work
      # Read-only on purpose: the container should never be able to rewrite
      # your keys or known_hosts. Consequence -- SSH to the stick once from
      # the host first so its host key is already recorded.
      #
      # Mounted at BOTH homes because which user runs depends on the daemon:
      # rootful Docker uses the UID-matched `ansible` account, rootless uses
      # root (see actl). OpenSSH resolves ~ from the passwd database and
      # ignores $HOME, so a single mount at /home/ansible leaves root looking
      # in /root/.ssh, finding no known_hosts, and failing every connection
      # with "Host key verification failed" while the host knows the key
      # perfectly well.
      - ${HOME}/.ssh:/home/ansible/.ssh:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      # Agent forwarding, so passphrase-protected keys work without the
      # passphrase ever entering the container.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      ANSIBLE_CONFIG: /work/ansible.cfg
    working_dir: /work
    # Interactive so --check --diff output and any prompts behave.
    stdin_open: true
    tty: true

  # `docker compose up iperf` -- the server end of the throughput probe.
  # Host networking so the stick can reach it on the LAN.
  iperf:
    image: uxplay-atom-ansible
    network_mode: host
    entrypoint: ["iperf3", "-s"]

  # `docker compose up gui` -- the movie player's web UI on a dev machine,
  # at http://localhost:8080/. See Dockerfile.gui for what this does and does
  # not prove; the short version is that everything except the display is real.
  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: playstick-gui
    # Published on every interface, like the device is: the page is meant to be
    # driven from a phone and looking at it on one is most of the point. It has
    # no authentication, there or here.
    #
    # 8080 on the host, 80 in the container. The container port matches
    # player_port so the dev image runs the device's configuration; the host
    # port does not, because a published port below 1024 is refused outright
    # under rootless Docker and usually taken on any other machine. Set
    # PLAYSTICK_GUI_PORT=80 if you want the real thing and your host allows it.
    ports:
      - "${PLAYSTICK_GUI_PORT:-8080}:80"
    volumes:
      # The repository's own daemon and page, over the copies baked into the
      # image. Edit the HTML and reload the browser; the daemon re-reads it on
      # every request. Python changes need `docker compose restart gui`.
      #
      # The package is mounted as a DIRECTORY, which also sidesteps something
      # the two single-file mounts below still suffer from: a bind-mounted file
      # is bound to an inode, and an editor that writes a replacement and
      # renames it over the original leaves the container holding the old one
      # until it is restarted. A directory mount resolves names on each open.
      - ./roles/player/files/playstick:/usr/local/lib/playstick:ro
      - ./roles/player/files/playstick-ui.html:/usr/local/share/playstick/ui.html:ro
      - ./roles/player/files/playstick-web.py:/usr/local/bin/playstick-web.py:ro
      # playstick-prep.py runs on the DEVELOPER machine, never on the stick,
      # and this container is the closest thing to one that also has the
      # library mounted -- ffmpeg is already here for the sample generator. It
      # is how the per-language headphone audio gets made for the test films:
      #   docker compose exec gui playstick-prep.py --library /srv/movies \
      #       --transcode never --verify none --no-posters \
      #       --min-duration 10 --min-size-mb 0
      - ./scripts:/work/scripts:ro
      # A generated test library by default. Point it at your own films with
      # PLAYSTICK_GUI_LIBRARY=/path/to/movies -- read-write only because the
      # generator populates an empty volume; nothing else here ever writes
      # under it, and it will not generate into a directory that has files.
      - "${PLAYSTICK_GUI_LIBRARY:-playstick-gui-library}:/srv/movies"
      # Named rather than a bind mount, so extracted posters do not turn up in
      # the repo owned by root. `docker compose down -v` resets both.
      - playstick-gui-thumbs:/var/cache/playstick/thumbs
    environment:
      # The one the device sets and the image cannot: the role's default skip
      # regex, kept in step with player_skip_pattern.
      PLAYSTICK_SKIP_PATTERN: 'sample|trailer|extras?\b|behind[ ._-]the[ ._-]scenes'
      PLAYSTICK_EXTENSIONS: ".mkv .mp4 .m4v .avi .mov .m2ts .ts"
      # player_allow_networks is deliberately not set: the Docker bridge is
      # inside 172.16.0.0/12 and would pass it anyway, so enforcing it here
      # would only ever reject the host and teach nothing.
    stdin_open: true
    tty: true

volumes:
  playstick-gui-library:
  playstick-gui-thumbs:
