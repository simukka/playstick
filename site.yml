---
# Runs on the control machine before anything tries to connect. The site file
# carries ansible_host, so a fresh clone without it does not fail with a
# missing variable -- Ansible quietly falls back to the inventory name and the
# run dies at "Could not resolve hostname vivostick", which points at DNS
# rather than at the file you have not created yet.
- name: Check the site configuration exists
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags: always
  # Without this the assert fails localhost and the run carries on: failures
  # are per-host, and the play that follows targets a different host entirely.
  any_errors_fatal: true

  tasks:
    - name: Look for the site file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/host_vars/vivostick/local.yml"
      register: site_local_vars

    - name: Require the site file
      ansible.builtin.assert:
        that: site_local_vars.stat.exists
        fail_msg: >-
          host_vars/vivostick/local.yml is missing. It holds the values that
          are specific to your LAN -- the stick's address, the login, the NAS
          -- and it is gitignored, so a fresh clone never has one. Create it:
          cp host_vars/vivostick/local.yml.example host_vars/vivostick/local.yml
          and edit it. Secrets are a separate file: host_vars/vivostick/vault.yml,
          encrypted, and that one IS committed.
        success_msg: "Site configuration found."

- name: Provision the VivoStick TS10 as a no-X AirPlay receiver
  hosts: vivostick
  become: true
  gather_facts: true

  pre_tasks:
    - name: Confirm we are on the expected platform
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: >-
          Expected Ubuntu on x86_64; found
          {{ ansible_facts['distribution'] }} on {{ ansible_facts['architecture'] }}.
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          kernel {{ ansible_facts['kernel'] }}, {{ ansible_facts['memtotal_mb'] }} MB RAM.

  roles:
    - base
    # Trim before installing: autoremove then has nothing of ours to catch,
    # and the freed disk is available to the package installs that follow.
    - trim
    - graphics
    - uxplay
    # After uxplay: the idle screen's subtitle is derived from the advertised
    # AirPlay name, and its assert checks the flags uxplay was configured with.
    - idle
    # The share before the player, so the library exists to be scanned the
    # moment the daemon starts.
    - nas
    # Last of the display consumers: the player has to stop the AirPlay unit
    # to take DRM master, so it asserts that unit is installed, and it needs
    # drm_card_path from graphics and uxplay_port for the mirroring gate.
    - player
    - probe
