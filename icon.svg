<svg xmlns="http://www.w3.org/2000/svg" viewBox="535.5 134.5 520 520" width="520" height="520" role="img">
  <title>playstick</title>
  <defs>
    <!-- Main tube: cyan at the top-left corner, through violet, to orange at the right vertex. -->
    <linearGradient id="tube" gradientUnits="userSpaceOnUse" x1="640" y1="190" x2="958" y2="370">
      <stop offset="0" stop-color="#37d3fe"/>
      <stop offset="0.28" stop-color="#3a9cfd"/>
      <stop offset="0.52" stop-color="#7c5ef8"/>
      <stop offset="0.76" stop-color="#fa5a89"/>
      <stop offset="1" stop-color="#ffa04c"/>
    </linearGradient>
    <!-- Return leg: fades in over the orange vertex, then runs coral to magenta into the stem. -->
    <linearGradient id="return" gradientUnits="userSpaceOnUse" x1="885" y1="398" x2="710" y2="540">
      <stop offset="0" stop-color="#ff9a50" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ff7a55"/>
      <stop offset="0.5" stop-color="#ff5a6e"/>
      <stop offset="0.75" stop-color="#dd42ab"/>
      <stop offset="1" stop-color="#c03ace"/>
    </linearGradient>
    <!-- Left leg darkens to violet at its rounded end. -->
    <linearGradient id="leg" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="392">
      <stop offset="0" stop-color="#8b4ff4" stop-opacity="0"/>
      <stop offset="1" stop-color="#9a4cf2"/>
    </linearGradient>
    <!-- Soft highlight along the outer top of the tube. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="640" y1="200" x2="900" y2="320">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="596" y1="0" x2="824" y2="0">
      <stop offset="0" stop-color="#4c71fd"/>
      <stop offset="0.5" stop-color="#c03ace"/>
      <stop offset="1" stop-color="#fc536e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tubeClip">
      <path d="M652.5,393 V265 Q652.5,193 720,231.7 L880,323.3 Q950.7,363.7 880,401.5 L760,465.7 Q710.5,492.4 710.5,535 V556"
            fill="none" stroke="#000" stroke-width="88"/>
    </clipPath>
  </defs>

  <rect x="535.5" y="134.5" width="520" height="520" rx="112" fill="#050509"/>

  <!-- Joystick base: a disc with a dark socket the stick drops into. -->
  <ellipse cx="710" cy="575.5" rx="114" ry="37.5" fill="url(#base)"/>
  <ellipse cx="710" cy="558" rx="58" ry="20" fill="#06060b"/>

  <!-- The stick: one tube folded into a play triangle. -->
  <g fill="none" stroke-width="88">
    <path d="M652.5,393 V265 Q652.5,193 720,231.7 L880,323.3 Q950.7,363.7 880,401.5 L760,465.7 Q710.5,492.4 710.5,535 V556"
          stroke="url(#tube)"/>
    <path d="M880,401.5 L760,465.7 Q710.5,492.4 710.5,535 V556" stroke="url(#return)"/>
    <path d="M652.5,300 V393" stroke="url(#leg)" stroke-linecap="round"/>
  </g>
  <ellipse cx="710.5" cy="556" rx="44" ry="12" fill="#c03ace"/>

  <!-- Depth: a highlight on the outer top edge, and shade where the tube bends into the stem. -->
  <g clip-path="url(#tubeClip)">
    <path d="M612,330 V265 Q612,170 700,195 L895,305" fill="none" stroke="url(#sheen)" stroke-width="22" filter="url(#soft)"/>
    <path d="M668,478 Q720,455 770,478" fill="none" stroke="#5a1070" stroke-opacity="0.25" stroke-width="18" filter="url(#soft)"/>
  </g>

</svg>
