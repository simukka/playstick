[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playstick"
version = "0.1.0"
description = "Desktop admin and library manager for the playstick appliance"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ruamel.yaml>=0.17",
]

[project.scripts]
playstick = "playstick_admin.__main__:main"

[tool.setuptools]
# The preparer, as a top-level module beside the package. playstick_prep.py
# here is a symlink to src/prep/playstick_prep.py; a built wheel carries the
# file itself, so an installed app needs no checkout -- see paths.py.
py-modules = ["playstick_prep"]
packages = [
    "playstick_admin",
    "playstick_admin.bridges",
    "playstick_admin.core",
    "playstick_admin.views",
]
