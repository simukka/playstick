[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playstick-admin"
version = "0.1.0"
description = "Desktop admin and library manager for the playstick appliance"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ruamel.yaml>=0.17",
]

[project.scripts]
playstick-admin = "playstick_admin.__main__:main"

[tool.setuptools]
packages = [
    "playstick_admin",
    "playstick_admin.bridges",
    "playstick_admin.core",
    "playstick_admin.views",
]
