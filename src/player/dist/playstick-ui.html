<!-- Managed by Ansible (uxplay-atom)

     The whole UI, in one file. No CDN, no web fonts, no external images: the
     stick may have no route to the internet and the phone holding this page
     very well might not either.

     The page itself is only this shell. Every element and every rule is built
     by the bundle below, from the TypeScript in src/ -- a view and the markup
     it writes to are one thing, and this is what is left when they are kept
     together. What stays here is what the parser must see before the script
     runs: the character set, how the phone should size the page, the colour the
     browser paints around it, and the icons.
-->
