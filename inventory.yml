---
# The stick is declared here and located elsewhere. ansible_host and
# ansible_user deliberately do not appear: this file is committed, and an
# address and a login are facts about one LAN rather than about the appliance.
# They come from the playstick app's Settings, which writes them to a second
# inventory source that actl mounts -- see ansible.cfg. Then:
#
#   ./actl 'ansible -m ping vivostick'
#
# site.yml checks they are there before trying to connect: without them
# Ansible falls back to the inventory name and reports "Could not resolve
# hostname vivostick", which does not point at the cause.
all:
  hosts:
    vivostick:
      # Not site-specific: Ubuntu 26.04 puts python3 exactly here, and letting
      # Ansible discover it costs a round trip on every run.
      ansible_python_interpreter: /usr/bin/python3
